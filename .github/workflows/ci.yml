name: CI

# O pipeline vive em github.com/rigst/ci. Ajuste lá vale para todos os projetos.

on:
  push:
    branches: [main]
  pull_request:
  # Botão de reprovocação. Em 02/09/2026 um merge na main do sistema_vetorial
  # não gerou evento de push: zero check-runs no commit, logo nenhum CI e —
  # porque o CD pende de `workflow_run` — nenhum deploy. Um commit entrou na
  # main sem validação e o servidor ficou para trás, em silêncio. Sem isto a
  # única saída seria um commit vazio só para provocar o push de novo.
  # Serve também de redeploy manual quando o CD falha por motivo transitório.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # Fixado no SHA, e não na tag v1: tag é ponteiro móvel, e quem puder
    # reescrevê-la passa a rodar código arbitrário com os secrets deste repo.
    # O comentário ao lado é o que o Dependabot lê para propor a subida.
    uses: rigst/ci/.github/workflows/python-django.yml@566c2d8c37ca30f390bcd4dc5f1c6e03014cbd4f # v1
    # Explícito em vez de `secrets: inherit`: o workflow chamado recebe só
    # este, e não tudo que o repositório tiver hoje ou vier a ter.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      python-version: "3.12"
      django-settings-module: config.settings.production
      source-paths: "config core legal splitter ocr"

      # Os testes rodam nos settings de desenvolvimento (SQLite), então o job
      # não precisa de Postgres.
      test-settings-module: config.settings.development
      postgres: false

      # Valores fictícios, só para o check --deploy conseguir importar os
      # settings de produção. Nada aqui é segredo real.
      django-env: |
        SECRET_KEY=ci-only-9f8e7d6c5b4a3210-NaoEhUmaChaveReal-zyxwvutsrq
        ALLOWED_HOSTS=example.com
        DB_NAME=postgres
        DB_USER=postgres
        DB_PASSWORD=postgres
        DB_HOST=localhost
        DB_PORT=5432
        REDIS_URL=redis://localhost:6379/1
        # O Django exige que FILE_UPLOAD_TEMP_DIR exista (files.E001), e
        # media/tmp não vem no repositório.
        FILE_UPLOAD_TEMP_DIR=/tmp

      # Nada em soft-fail: toda etapa bloqueia, inclusive as cinco novas.
      # Ruff e mypy já foram zerados (ver histórico), e o portão fecha sobre
      # isso — deixar em soft-fail não protegeria da próxima regressão.
      # As etapas de qualidade entram toleradas enquanto o passivo é medido.
      # Lista vazia significa "nada tolerado": ligá-las sem declarar aqui
      # reprovaria no primeiro dia.
      # O ALLOWED_HOSTS de teste precisa incluir 127.0.0.1: é onde o servidor
      # dos jobs de a11y e de layout responde. Sem isso o Django devolve
      # DisallowedHost (HTTP 400) em todas as rotas, e as duas etapas medem a
      # página de erro em vez do site — no axe isso é pior que uma falha, porque
      # a tela de erro passa quase limpa e a acessibilidade fica verde sem ter
      # auditado nada. Descoberto em 10/09/2026.
      test-env: |
        ALLOWED_HOSTS=localhost,127.0.0.1,testserver

      soft-fail: "diff,frontend,layout"

      # --- qualidade ---
      #
      # Apertado em 10/09/2026. A primeira medição dava 42 achados de layout,
      # 24 deles bloqueantes; nenhum era real. O servidor devolvia HTTP 400 em
      # todas as rotas e a etapa media a página de erro do Django. Com o
      # ALLOWED_HOSTS corrigido e a rota inexistente removida, sobram 5
      # achados — 2 de conteúdo cortado e 3 de alvo de toque —, todos aviso.
      run-diff-quality: true
      diff-quality-fail-on: erro

      # frontend-paths precisa ser explícito: o glob de CSS a partir da raiz
      # varre o venv/ inteiro e o job trava sem mensagem de erro.
      run-frontend: true
      frontend-paths: "static"
      template-paths: "templates"
      frontend-fail-on: erro

      # As mesmas rotas públicas que o a11y já audita.
      run-layout: true
      layout-fail-on: erro
      layout-setup-command: python manage.py importar_documentos_legais --publicar
      layout-paths: |
        /
        /ocr/
        /termos/
        /privacidade/
        /admin/login/

      # --- conformidade ---
      run-licencas: true
      run-sbom: true

      # Confere o requirements.lock contra o requirements.txt (que passou a
      # trazer pin exato, vindo do `pip freeze` do servidor) e instala com
      # --require-hashes. Resolvido para 3.12, a versão que produção roda.
      run-lock: true

      # --- ponta a ponta ---
      # splitter/tests_e2e.py. Vale mais aqui do que nos outros projetos: esta
      # é a única tela do sistema, e ela depende de JavaScript para montar a
      # lista de arquivos e habilitar o envio.
      run-e2e: true

      # --- acessibilidade ---
      run-a11y: true
      a11y-setup-command: python manage.py importar_documentos_legais --publicar
      # Sem /legal/aceite/: esta rota levanta Http404 neste projeto por
      # projeto, não por falta de dado. Ela depende de LEGAL_VISITOR_ACTION,
      # que os outros sistemas definem e este não — o divisor não tem contas,
      # o aceite é anônimo e preso à sessão, como o legal/urls.py explica. A
      # rota veio copiada dos outros repos e vinha auditando a página de erro.
      a11y-paths: |
        /
        /ocr/
        /termos/
        /privacidade/
        /admin/login/
      # Medido antes de ligar: zero violações nas cinco páginas em WCAG 2.1 AA.
      a11y-fail-on: serious

      # Desligado nas PRs do Dependabot: o GitHub não entrega os secrets do
      # Actions a esse ator, e sem o SONAR_TOKEN o scanner falha com
      # "Not authorized" — travando toda atualização de dependência, já que o
      # job `CI` é obrigatório no branch protection.
      run-sonar: ${{ github.actor != 'dependabot[bot]' }}
      sonar-project-key: rigst_divisor_pdf
      sonar-organization: rigst
      # `qualitygate.wait`: sem isto o job termina verde assim que envia a
      # análise, e o gate reprovando não aparece no CI.
      #
      # `scripts/**` e `deploy/**` saem da análise: são ferramentas de
      # desenvolvedor e de operação que a aplicação nunca importa, já omitidas
      # do .coveragerc e do testpaths.
      #
      # As duas listas repetem a do pipeline compartilhado porque propriedade
      # repetida no scanner é substituída, não somada.
      # `**/*.js` e `**/*.html`: não existe teste de JavaScript neste projeto e
      # nunca existiu, então contar essas linhas como 0% não informa nada — só
      # esconde a cobertura real do Python atrás de um número ruim. Mesmo
      # tratamento já dado ao sistema_vetorial.
      #
      # `**/celery.py`: o módulo é configuração de app, executado pelo worker e
      # não pela suíte.
      sonar-args: >-
        -Dsonar.qualitygate.wait=true
        -Dsonar.exclusions=**/migrations/**,**/staticfiles/**,**/node_modules/**,**/venv/**,**/.venv/**,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.ico,**/*.webp,**/*.pdf,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,scripts/**,deploy/**
        -Dsonar.coverage.exclusions=**/migrations/**,**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,**/conftest.py,**/settings/**,**/settings.py,**/manage.py,**/wsgi.py,**/asgi.py,**/celery.py,scripts/**,deploy/**,**/*.js,**/*.html
