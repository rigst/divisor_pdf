{% comment %}
Cartão de erro, comum às duas telas. `titulo` nomeia o que falhou.
{% endcomment %}
    <!-- Error Section -->
    <section id="error-section" class="card card-error" style="display: none;">
        <div class="card-header">
            <div class="card-icon card-icon-error">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </div>
            <div class="card-head-text">
                <span class="ds-kicker">Falha</span>
                <h2>{{ titulo }}</h2>
            </div>
        </div>
        <div class="ds-alert ds-alert--danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <p id="error-message"></p>
        </div>
        <button type="button" id="retry-btn" class="ds-btn ds-btn--ghost ds-btn--block">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
            <span>Tentar novamente</span>
        </button>
    </section>
