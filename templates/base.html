<!DOCTYPE html>
<html lang="pt-BR" class="ds-theme-violet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Divida arquivos PDF grandes em partes menores de forma rápida e segura. Upload, defina o tamanho máximo e baixe o resultado.">
    <meta name="theme-color" content="#0f1115">
    <title>{% block title %}Divisor de PDFs{% endblock %}</title>

    <!-- Tema claro/escuro: aplica a preferência ANTES do CSS para evitar "flash".
         'auto' (sem preferência salva) segue o sistema. -->
    <script>(function(){var e=document.documentElement;e.classList.add("js");try{var m=localStorage.getItem("ds-theme-mode");if(m==="dark"||(!m&&matchMedia("(prefers-color-scheme:dark)").matches))e.classList.add("ds-dark");}catch(x){}})();</script>

    {% load static %}
    <!-- Fontes auto-hospedadas (sem CDN externo — alinhado ao design system Stölben) -->
    <link rel="stylesheet" href="{% static 'fonts/fonts.css' %}">
    <!-- Design system Stölben (tokens + componentes .ds-*) -->
    <link rel="stylesheet" href="{% static 'css/stolben-ui.css' %}">
    <!-- Camada específica do app (sobre os tokens do DS) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="ds-root">
    <div class="ds-app">
        <div class="ds-lines" aria-hidden="true"><span></span><span></span><span></span></div>
        {% block content %}{% endblock %}
    </div>

    <script src="{% static 'js/stolben-ui.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
